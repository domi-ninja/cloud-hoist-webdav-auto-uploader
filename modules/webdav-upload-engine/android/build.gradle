plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'com.google.devtools.ksp' version '2.1.20-2.0.1'
}

group = 'ninja.domi.cloudhoist.engine'
version = '0.1.0'

def repositoryRoot = file('../../..')
def releaseIdentity = new groovy.json.JsonSlurper().parse(new File(repositoryRoot, 'app.json')).expo
def monitoring = new groovy.json.JsonSlurper().parse(new File(repositoryRoot, 'monitoring.json'))
def monitoringDsn = System.getenv('SENTRY_DSN') ?: monitoring.dsn
def channel = System.getenv('CLOUD_HOIST_CHANNEL') ?: 'beta'

android {
  buildFeatures { buildConfig true }
  namespace "ninja.domi.cloudhoist.engine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    buildConfigField 'String', 'SENTRY_DSN', groovy.json.JsonOutput.toJson(monitoringDsn)
    buildConfigField 'String', 'APP_RELEASE', groovy.json.JsonOutput.toJson("cloud-hoist@${releaseIdentity.version}")
    buildConfigField 'String', 'APP_CHANNEL', groovy.json.JsonOutput.toJson(channel)
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    androidTest.assets.srcDirs += files("$projectDir/schemas")
  }
}

ksp {
  arg 'room.schemaLocation', "$projectDir/schemas"
}

tasks.configureEach { task ->
  if (task.name == 'mergeDebugAndroidTestAssets') {
    task.dependsOn('kspDebugKotlin')
  }
}

dependencies {
  implementation 'io.sentry:sentry-android-core:8.62.0'
  implementation 'androidx.room:room-runtime:2.8.4'
  implementation 'androidx.work:work-runtime:2.11.2'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  ksp 'androidx.room:room-compiler:2.8.4'
  androidTestImplementation 'androidx.room:room-testing:2.8.4'
  androidTestImplementation 'androidx.work:work-testing:2.11.2'
  androidTestImplementation 'androidx.test:core-ktx:1.6.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
  androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
}
