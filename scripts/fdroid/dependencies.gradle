// Inventory the actual release artifacts, including classifier/variant-named AARs.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('fdroidDependencyInventory') {
        doLast {
            def artifacts = app.configurations.releaseRuntimeClasspath.incoming.artifactView {
                componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            }.artifacts.artifacts.collectEntries { artifact ->
                [(artifact.id.componentIdentifier.toString()): artifact.file]
            }
            def rows = app.configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents
                .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                .collect { component ->
                    def id = component.id
                    def artifact = artifacts["${id.group}:${id.module}:${id.version}".toString()]
                    [group: id.group, name: id.module, version: id.version, file: artifact?.absolutePath]
                }.sort { a, b -> "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}" }
            def output = new File(gradle.rootProject.projectDir.parentFile, 'dist/fdroid-native-dependencies.json')
            output.parentFile.mkdirs()
            output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(rows)) + '\n'
            def reviewed = new groovy.json.JsonSlurper().parse(new File(output.parentFile.parentFile, 'licenses/native.json')).keySet()
            def resolved = rows.collect { row -> "${row.group}:${row.name}:${row.version}".toString() }.toSet()
            if (resolved != reviewed) {
                throw new GradleException("Native license inventory changed. Missing: ${resolved - reviewed}; unused: ${reviewed - resolved}. Review and refresh licenses before release.")
            }
            println "Verified licenses for ${resolved.size()} native components."
        }
    }
}
