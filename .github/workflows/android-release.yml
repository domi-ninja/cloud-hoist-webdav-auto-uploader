name: Android release

on:
  push:
    tags: ["v20*-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip an already published version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r '.expo.version' app.json)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Release tag does not match app.json" >&2
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $VERSION is already published; reusing that release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: check-version
    if: needs.check-version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: "true"
      NODE_ENV: production
      EXPO_PUBLIC_RELEASE_CHANNEL: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Configure Gradle memory
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1024m
          org.gradle.workers.max=2
          EOF
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Check application and release logic
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm test:publish
          pnpm test:release
      - name: Assign release build number
        run: node scripts/android/github-release.mjs prepare
      - name: Test native engine
        run: pnpm test:native
      - name: Restore release signing identity
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_SIGNING_JSON: ${{ secrets.ANDROID_RELEASE_SIGNING_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          os.umask(0o077)
          root = Path('.signing')
          root.mkdir(mode=0o700)
          credentials = json.loads(os.environ['RELEASE_SIGNING_JSON'])
          if credentials['storeFile'] != 'release.p12':
              raise ValueError('Unexpected signing key filename')
          (root / 'release.json').write_text(json.dumps(credentials))
          (root / 'release.p12').write_bytes(base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64'], validate=True))
          PY
      - name: Build and verify signed APK
        run: pnpm android:beta
      - name: Package public release and update manifest
        id: package
        run: node scripts/android/github-release.mjs package
      - name: Retain build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-hoist-${{ steps.package.outputs.version_code }}
          path: |
            dist/github/*.apk
            dist/github/update.json
            dist/github/SHA256SUMS
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_BUILD: ${{ steps.package.outputs.version_code }}
        run: |
          gh release create "$RELEASE_TAG" dist/github/*.apk dist/github/update.json dist/github/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Cloud Hoist ${RELEASE_TAG#v}" --notes-file dist/github/release-notes.md
      - name: Remove signing files
        if: always()
        run: rm -rf .signing
