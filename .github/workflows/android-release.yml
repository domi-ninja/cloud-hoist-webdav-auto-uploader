name: F-Droid candidate checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
    tags: ['v20*-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.3.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false --ignore-scripts --no-runtime
      - name: Check source and notices
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm test:release
          pnpm icons:check
          pnpm licenses:check
      - name: Test native engine
        run: pnpm test:native
      - name: Validate F-Droid source, build, and APK
        run: |
          python3 -m venv /tmp/fdroid-check
          /tmp/fdroid-check/bin/pip install fdroidserver==2.4.5
          GRADLE_BIN=$(find "$HOME/.gradle/wrapper/dists/gradle-9.3.1-bin" -type f -path '*/bin/gradle' -print -quit)
          /tmp/fdroid-check/bin/python scripts/fdroid/validate.py --gradle "$GRADLE_BIN"
      - name: Retain validation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fdroid-unsigned-${{ github.sha }}
          path: dist/**/*-unsigned.apk
          retention-days: 14
