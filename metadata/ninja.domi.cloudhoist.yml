IssueTracker: https://github.com/domi-ninja/cloud-hoist-webdav-auto-uploader/issues
AutoName: Cloud Hoist
Summary: Automatically back up phone folders to your Nextcloud server
Description: |-
  Cloud Hoist backs up selected Android media folders to your own Nextcloud server.
  Choose a destination for each folder and set charging, network, and battery conditions.

  Files stay on your phone. Conflicting destination files are kept with numbered names.
  No advertising or analytics. Requires Android 10 or later and a Nextcloud account.

