MaintainerNotes: |-
  Candidate only; F-Droid build-server and maintainer review are still pending.
  Expo generates android/ during preparation, so there is no generated native subdir in git.
  Expo Android modules build from source. Unused npm prebuilts and legacy local Maven repositories are removed.
  The source scan has one font warning (unused Fontisto.ttf). No blanket node_modules exclusion.
  Signed reference APKs are hosted in GitHub verification prereleases, outside normal version-tag discovery.
  Version 2026-7 reproduced locally and in independent CI. Validate each new candidate separately.
  Complete embedded notices and the per-package catalogue are under licenses/.
  Existing installations must not be uninstalled or cleared to switch signing keys.

